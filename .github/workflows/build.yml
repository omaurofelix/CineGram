name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Ensure signing key
        run: |
          if [ -f signing/debug.jks ]; then
            echo "Signing key already present"
            exit 0
          fi
          mkdir -p signing
          keytool -genkeypair -v -keystore signing/debug.jks \
            -storepass cinegram -keypass cinegram -alias cinegram \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CineGram, OU=Personal, O=CineGram, L=Sao Paulo, C=BR"
          git config user.name "cinegram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signing/debug.jks
          git commit -m "Add the fixed signing key"
          git push
      - name: Write credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          printf 'TG_API_ID=%s\nTG_API_HASH=%s\n' "$TG_API_ID" "$TG_API_HASH" > local.properties
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
